<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Medix - تسوق أفضل المنتجات بأعلى جودة وأفضل الأسعار">
  <meta name="theme-color" content="#ffffff">
  <title>Medix | ميدكس</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css?v=90">
  <link rel="stylesheet" href="css/slider.css?v=90">
  <script src="https://unpkg.com/@phosphor-icons/web" defer></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js" defer></script>
</head>
<body>
  <!-- Loading Screen - prevents flash of stale cached data -->
  <div id="app-loader" style="position:fixed; inset:0; z-index:99999; background:#ffffff; display:flex; flex-direction:column; align-items:center; justify-content:center; transition:opacity 0.4s ease;">
    <div style="width:40px; height:40px; border:3px solid #f0f0f0; border-top-color:#c9a04e; border-radius:50%; animation:spin 0.8s linear infinite;"></div>
    <p style="margin-top:16px; font-family:'Cairo',sans-serif; color:#888; font-size:14px;">جاري التحميل...</p>
  </div>
  <style>@keyframes spin{to{transform:rotate(360deg)}}</style>

  <div id="announcement-bar-container" style="opacity:0; transition:opacity 0.3s ease;"></div>
  <div id="navbar-container" style="opacity:0; transition:opacity 0.3s ease;"></div>
  <div id="mobile-nav-container"></div>
  <main id="app" style="opacity:0; transition:opacity 0.3s ease;"></main>
  <div id="cart-sidebar-container"></div>
  <div id="modal-container"></div>
  <div id="toast-container" class="toast-container"></div>
  <div id="footer-container" style="opacity:0; transition:opacity 0.3s ease;"></div>

  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
  <script src="js/firebase-config.js?v=97"></script>
  <script src="js/store.js?v=97"></script>
  <script src="js/app.js?v=97"></script>
</body>
</html>
